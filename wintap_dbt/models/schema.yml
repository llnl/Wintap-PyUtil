version: 2

models:
  - name: stg_raw_process
    description: Canonical raw process parquet scan over raw_sensor.
    columns:
      - name: PidHash
        tests:
          - not_null
          - no_forbidden_pid_hash_values
      - name: Hostname
        tests:
          - not_null
      - name: dayPK
        tests:
          - not_null

  - name: stg_raw_process_conn_incr
    description: Canonical raw network increment parquet scan over raw_sensor with required protoPK partition.
    columns:
      - name: PidHash
        tests:
          - no_forbidden_pid_hash_values
      - name: dayPK
        tests:
          - not_null
      - name: hourPK
        tests:
          - not_null
      - name: protoPK
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tcp', 'udp']

  - name: stg_raw_process_file
    description: Canonical raw process-file parquet scan over raw_sensor.
    columns:
      - name: PidHash
        tests:
          - no_forbidden_pid_hash_values

  - name: stg_raw_host
    description: Canonical raw host parquet scan over raw_sensor.
    columns:
      - name: Hostname
        tests:
          - not_null

  - name: process
    description: Process entity table normalized from raw process events.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - unique
          - no_forbidden_pid_hash_values
      - name: parent_pid_hash
        tests:
          - no_forbidden_pid_hash_values
      - name: hostname
        tests:
          - not_null

  - name: process_net_conn
    description: Connection-level network activity aggregated from network increments.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - no_forbidden_pid_hash_values
      - name: conn_id
        tests:
          - not_null

  - name: process_file
    description: Process-file activity aggregated from raw file events.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - no_forbidden_pid_hash_values

  - name: process_registry
    description: Process-registry activity aggregated from raw registry events.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - no_forbidden_pid_hash_values

  - name: process_image_load
    description: Process image/DLL load activity aggregated from raw image-load events.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - no_forbidden_pid_hash_values

  - name: process_path
    description: Recursive paths from process to root process.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - no_forbidden_pid_hash_values

  - name: process_summary
    description: Process-centric summary with host, registry, file, network, and image-load features.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - unique
          - no_forbidden_pid_hash_values

  - name: process_uber_summary
    description: Broad process-centric feature table with optional enrichment columns.
    columns:
      - name: pid_hash
        tests:
          - not_null
          - unique
          - no_forbidden_pid_hash_values

  - name: pidstat_metrics
    description: Normalized silver detail model for pidstat performance samples.
    columns:
      - name: time
        tests:
          - not_null
      - name: hostname
        tests:
          - not_null
      - name: pid
        tests:
          - not_null
      - name: cpu_percent
        description: Raw-compatible core-summed process CPU percent; 100 means one fully occupied logical CPU.
      - name: cpu_core_percent
        description: Explicit alias of cpu_percent for core-summed process CPU percent.

  - name: pidstat_process_summary
    description: Gold pidstat summary grouped by host, container, PID, and command; this is not a lifetime-stable process identity.
    columns:
      - name: hostname
        tests:
          - not_null
      - name: pid
        tests:
          - not_null
      - name: first_seen
        tests:
          - not_null
      - name: last_seen
        tests:
          - not_null
      - name: max_cpu_core_percent
        description: Maximum core-summed process CPU percent in the PID/command group.
      - name: avg_cpu_core_percent
        description: Average core-summed process CPU percent in the PID/command group.
      - name: max_cpu_percent
        description: Compatibility alias of max_cpu_core_percent.
      - name: avg_cpu_percent
        description: Compatibility alias of avg_cpu_core_percent.

  - name: perf_chart
    description: Ten-second pidstat monitoring metrics.
    columns:
      - name: max_cpu_core_percent
        description: Explicit maximum core-summed process CPU percent.
      - name: max_cpu
        description: Compatibility alias of max_cpu_core_percent.

  - name: telemetry_event_summary
    description: Monitoring summary across telemetry event families.
    columns:
      - name: max_cpu_core_percent
        description: Explicit maximum core-summed process CPU percent for performance rows.
      - name: max_cpu
        description: Compatibility alias of max_cpu_core_percent for performance rows.

  - name: stg_raw_selinuxavc
    description: Optional bronze scan for native SELinux AVC records; num_dups counts identical raw rows.
    columns:
      - name: MessageType
        tests: [not_null]
      - name: EventTime
        tests: [not_null]
      - name: EventCount
        tests: [not_null]
      - name: num_dups
        tests: [not_null]

  - name: stg_raw_selinuxinteraction
    description: Optional bronze scan for folded or permission-expanded SELinux interaction records.
    columns:
      - name: MessageType
        tests: [not_null]
      - name: EventTime
        tests: [not_null]
      - name: EventCount
        tests: [not_null]
      - name: num_dups
        tests: [not_null]

  - name: stg_raw_selinuxtransition
    description: Optional bronze scan for native SELinux context-transition records.
    columns:
      - name: MessageType
        tests: [not_null]
      - name: EventTime
        tests: [not_null]
      - name: EventCount
        tests: [not_null]
      - name: num_dups
        tests: [not_null]

  - name: selinux_avc
    description: Silver AVC detail at the deduplicated native row grain. EventTime is Unix seconds; FirstSeen and LastSeen are FILETIME.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_family
        tests:
          - accepted_values:
              arguments:
                values: ['selinux_avc']
      - name: event_count
        tests: [not_null]
      - name: first_seen
        tests: [not_null]
      - name: last_seen
        tests: [not_null]

  - name: selinux_interaction
    description: Silver folded or permission-expanded interaction detail; event_count is the producer observation count, not a row count.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_family
        tests:
          - accepted_values:
              arguments:
                values: ['selinux_interaction']
      - name: event_count
        tests: [not_null]
      - name: first_seen
        tests: [not_null]
      - name: last_seen
        tests: [not_null]

  - name: selinux_transition
    description: Silver context-transition detail at the deduplicated native row grain.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_family
        tests:
          - accepted_values:
              arguments:
                values: ['selinux_transition']
      - name: event_count
        tests: [not_null]
      - name: first_seen
        tests: [not_null]
      - name: last_seen
        tests: [not_null]

  - name: selinux_attribution
    description: Shared SELinux attribution relation with exact, unique temporal fallback, ambiguous, and unmatched outcomes.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: attribution_status
        tests:
          - accepted_values:
              arguments:
                values: ['exact', 'unique_temporal', 'ambiguous', 'unmatched']
      - name: candidate_count
        tests: [not_null]

  - name: selinux_event_detail
    description: Common analytical detail index joined to family-specific silver payloads; family silver models remain authoritative.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_family
        tests:
          - accepted_values:
              arguments:
                values: ['selinux_avc', 'selinux_interaction', 'selinux_transition']
      - name: event_count
        tests: [not_null]

  - name: selinux_context
    description: Distinct observed SELinux contexts by family, role, and policy epoch with observation bounds and EventCount sums.

  - name: selinux_avc_summary
    description: AVC summary grouped by host, attribution outcome, process identity, contexts, class, result, enforcing state, and policy epoch.

  - name: selinux_interaction_summary
    description: Interaction summary preserving folded EventCount semantics and separating observation row counts from event counts.

  - name: selinux_transition_summary
    description: Transition summary grouped by host, attribution outcome, old/new contexts, executable, and policy epoch.

  - name: selinux_process_summary
    description: Process-centric SELinux summary with attribution outcomes retained as separate groups.

  - name: selinux_quality_summary
    description: Monitoring coverage, duplicate, timestamp, context, and attribution metrics for each SELinux event family.
